server {
    listen 80;
    root /usr/share/nginx/html;

    # Uploads are capped at 2 MB by the API; leave room for the form encoding.
    client_max_body_size 3m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Model fallbacks can take a while, and streamed progress must not be buffered.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Built assets have hashed names, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Every other path is a page of the single-page app.
    location / {
        try_files $uri /index.html;
    }
}
